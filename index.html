<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Glissade</title>
<meta name="description" content="A calm sliding block puzzle game for iPhone and iPad.">
<style>
:root{
  --bg1:#0A0C20; --bg2:#10133A; --bg3:#252C73;
  --text:#ECEFFF; --soft:#B9BFE6; --muted:#8C93C4;
  --accent:#7CFFD9; --card:rgba(22,26,72,.72); --line:rgba(160,170,255,.18);
}
@media (prefers-color-scheme: light){
  :root{
    --bg1:#F3F4FC; --bg2:#F7F8FD; --bg3:#E7EAFB;
    --text:#14163A; --soft:#3B3F73; --muted:#5E6396;
    --accent:#0A7A5D; --card:#FFFFFF; --line:rgba(40,45,120,.14);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--text);
  font:17px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg1) linear-gradient(180deg,var(--bg3) 0%,var(--bg2) 38%,var(--bg1) 100%) fixed;
}
.wrap{max-width:680px; margin:0 auto; padding:56px 20px 40px}
.brand{
  display:inline-flex; align-items:center; gap:12px; text-decoration:none; color:var(--text);
  font-size:15px; letter-spacing:.28em; font-weight:300; text-transform:uppercase;
}
.mark{width:26px; height:26px; border-radius:7px; background:var(--accent); display:inline-block;
  box-shadow:0 0 18px color-mix(in srgb,var(--accent) 45%,transparent)}
h1{font-size:34px; line-height:1.2; font-weight:300; letter-spacing:.01em; margin:44px 0 6px}
h2{font-size:19px; font-weight:600; margin:38px 0 6px; letter-spacing:.005em}
p,ul{margin:10px 0}
ul{padding-left:1.2em}
li{margin:7px 0}
li::marker{color:var(--accent)}
.meta{color:var(--muted); font-size:15px; margin:0 0 8px}
.lead{color:var(--soft); font-size:19px}
a{color:var(--accent); text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:6px 20px; margin:22px 0}
details{padding:14px 0; border-bottom:1px solid var(--line)}
details:last-child{border-bottom:0}
summary{cursor:pointer; font-weight:500; list-style:none; display:flex; justify-content:space-between; gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+"; color:var(--accent); font-weight:300; font-size:22px; line-height:1}
details[open] summary::after{content:"\2212"}
details p{color:var(--soft); margin:10px 0 2px}
.links{display:flex; flex-wrap:wrap; gap:12px; margin:28px 0}
.btn{
  display:inline-block; padding:13px 22px; border-radius:16px; text-decoration:none; font-weight:500;
  border:1px solid var(--line); background:var(--card); color:var(--text);
}
.btn.primary{background:var(--accent); color:#06231B; border-color:transparent}
footer{margin-top:64px; padding-top:22px; border-top:1px solid var(--line); color:var(--muted); font-size:14px}
footer a{color:var(--muted)}
@media (max-width:480px){ h1{font-size:29px} body{font-size:16.5px} .wrap{padding-top:36px} }
</style>
</head>
<body>
<div class="wrap">
<a class="brand" href="index.html"><span class="mark" aria-hidden="true"></span>Glissade</a>

<h1>Glissade</h1>
<p class="lead">A calm sliding block puzzle game for iPhone and iPad.</p>
<p>Slide each block until it stops, and bring every block to its target. Made by one independent developer.</p>
<div class="links">
  <a class="btn" href="support.html">Support</a>
  <a class="btn" href="privacy.html">Privacy Policy</a>
</div>

<footer>&copy; 2026 Joseph Pope &middot; <a href="privacy.html">Privacy Policy</a> &middot; <a href="support.html">Support</a></footer>
</div>
</body>
</html>
